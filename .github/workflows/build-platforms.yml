name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: ubuntu
            runner: ubuntu-22.04
          - platform: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --clean --noconfirm FiligranePDF.spec
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/FiligranePDF.exe,dist/README.txt -DestinationPath dist/FiligranePDF-Windows.zip
      - name: Build Ubuntu package
        if: matrix.platform == 'ubuntu'
        run: bash build_ubuntu.sh
      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: bash build_macos.sh
      - name: Upload Windows package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: FiligranePDF-windows
          path: dist/FiligranePDF-Windows.zip
          if-no-files-found: error
      - name: Upload Ubuntu package
        if: matrix.platform == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: FiligranePDF-ubuntu
          path: dist/FiligranePDF_1.0.0_*.deb
          if-no-files-found: error
      - name: Upload macOS package
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: FiligranePDF-macos
          path: dist/FiligranePDF-macOS.dmg
          if-no-files-found: error
